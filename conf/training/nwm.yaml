# CompACT paper settings for the navigation world model. The default launcher
# uses eight GPUs with per-GPU batch 16 for global observation batch 128.
notes: "compact_nwm_cdit_b_sdvae"
run_name: ${now:%Y%m%d_%H%M%S}_${training.notes}_bs${training.batch_size}
results_dir: /file_system/nas/algorithm/dujun.nie/nwm/compact/runs
batch_size: 16
# Per-GPU evaluation batch; null preserves the training batch size.
eval_batch_size: null
num_workers: 4
grad_clip_val: 2.0

from_checkpoint: null

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-4
  betas: [0.9, 0.999]
  weight_decay: 0.01

wandb_enabled: true
wandb_project: "compact-nwm"
wandb_entity: null
wandb_notes: ${training.notes}
wandb_tags: ["CompACT", "CDiT-B", "SD-VAE", "navigation"]

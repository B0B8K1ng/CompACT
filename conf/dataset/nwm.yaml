# Public navigation data used by the CompACT navigation world-model experiments.
# NWM_DATA_ROOT must contain recon/, sacson/, scand/, and tartan/ when the
# corresponding dataset is selected through motion_condition.dataset_motion_types.
image_size: 224
context_size: 4
normalize: true

# Safe library default: direct Hydra launches continue to read pixels unless
# explicitly enabled. nwm_train.sh enables the validated NAS cache by default.
precomputed_latents:
  enabled: false
  root: null
  cache_size: 8
  vae_identifier: stabilityai/sd-vae-ft-ema
  scaling_factor: 0.18215
  vae_encode_batch_size: 128

distance:
  min_dist_cat: -64
  max_dist_cat: 64

len_traj_pred: 64

action_stats:
  min: [-2.5, -4]
  max: [5, 4]

datasets:
  recon:
    data_folder: ${oc.env:NWM_DATA_ROOT}/recon
    train: data_splits/recon/train/
    test: data_splits/recon/test/
    goals_per_obs: 4
    metric_waypoint_spacing: 0.25
  sacson:
    data_folder: ${oc.env:NWM_DATA_ROOT}/sacson
    train: data_splits/sacson/train/
    test: data_splits/sacson/test/
    goals_per_obs: 4
    metric_waypoint_spacing: 0.255
  scand:
    data_folder: ${oc.env:NWM_DATA_ROOT}/scand
    train: data_splits/scand/train/
    test: data_splits/scand/test/
    goals_per_obs: 4
    metric_waypoint_spacing: 0.38
  tartan_drive:
    # The processed directory is named `tartan`; keep the public dataset name in
    # cache metadata and split paths so it cannot be confused with another source.
    # Opt in explicitly so the historical three-dataset NWM baseline is unchanged.
    enabled: false
    data_folder: ${oc.env:NWM_DATA_ROOT}/tartan
    train: data_splits/tartan_drive/train/
    test: data_splits/tartan_drive/test/
    goals_per_obs: 4
    metric_waypoint_spacing: 0.72
  go_stanford:
    # Held-out, evaluation-only environment from NWM. It must never be added
    # to the training motion-condition selection.
    enabled: false
    evaluation_only: true
    data_folder: ${oc.env:NWM_DATA_ROOT}/go_stanford
    train: data_splits/go_stanford/test/
    test: data_splits/go_stanford/test/
    goals_per_obs: 4
    metric_waypoint_spacing: 0.12
  planetary_rover:
    # Real NASA/CLEP Mars + Moon imagery. This source is test-only and must
    # remain disabled for every training/precompute selection.
    enabled: false
    evaluation_only: true
    data_folder: ${oc.env:NWM_DATA_ROOT}/planetary_rover
    test: data_splits/planetary_rover/test/
    goals_per_obs: 4
    metric_waypoint_spacing: 0.9741752833246042
    wrap_delta_yaw: true
    use_predefined_index: false
    temporal_semantics: spatial_index
